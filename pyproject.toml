[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relayloom"
dynamic = ["version"]
description = "Pay for what arrived. Prove it. Accounts payable that counts the goods with open weight Meta models (Muse Glimmer, SAM 3.1) on your own machine."
readme = "README_PYPI.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sriharsan B S" }]
keywords = ["accounts payable", "three-way match", "invoice", "receiving", "SAM 3.1", "Muse Glimmer", "signed receipts", "offline", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = ["cryptography>=44", "PyMuPDF>=1.26", "opencv-python-headless>=4.10", "numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
models = ["ultralytics>=8.3", "huggingface_hub>=0.26"]
qr = ["segno>=1.6"]

[project.scripts]
relayloom = "relayloom.cli:main"

[project.urls]
Homepage = "https://relayloom.vercel.app"
Documentation = "https://relayloom.vercel.app/developers"
Source = "https://github.com/Sriharsan/relayloom"
Issues = "https://github.com/Sriharsan/relayloom/issues"
Changelog = "https://github.com/Sriharsan/relayloom/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["relayloom", "relayloom.ap"]

[tool.setuptools.dynamic]
version = { attr = "relayloom.__version__" }

[tool.setuptools.package-data]
relayloom = ["policy.json", "py.typed"]
"relayloom.ap" = ["policy.json", "py.typed"]
